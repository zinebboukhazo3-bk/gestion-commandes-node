<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Permet d'adapter la page aux différentes tailles d'écran -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Gestion des commandes</title>

    <!-- Importation du fichier CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Conteneur principal de la page -->
    <main class="login-container">

        <!-- Section de présentation -->
        <section class="login-info">
            <h1>Gestion des commandes</h1>

            <p>
                Bienvenue sur notre plateforme de gestion.
                Connectez-vous pour accéder à votre espace.
            </p>
        </section>

        <!-- Formulaire de connexion -->
        <section class="login-form-container">

            <h2>Connexion</h2>

            <p class="subtitle">
                Entrez vos informations pour continuer.
            </p>

            <form id="loginForm">

                <!-- Champ email -->
                <div class="form-group">
                    <label for="email">Adresse email</label>

                    <input type="email" id="email" name="email" placeholder="exemple@gmail.com" required>
                </div>

                <!-- Champ mot de passe -->
                <div class="form-group">
                    <label for="password">Mot de passe</label>

                    <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe"
                        required>
                </div>

                <!-- Bouton de connexion -->
                <button type="submit" id="loginButton">
                    Se connecter
                </button>

                <!-- Zone d'affichage des messages -->
                <p id="message"></p>

            </form>

            <!-- Lien vers la page d'inscription (à créer ensuite) -->
            <p class="register-link">
                Vous n'avez pas de compte ?
                <a href="register.html">Créer un compte</a>
            </p>

        </section>

    </main>

    <!-- Importation du fichier JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
